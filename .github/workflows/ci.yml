name: Full Stack CI

on:
  push:
  pull_request:

jobs:

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fraud_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/fraud_test

    defaults:
      run:
        working-directory: Backend 

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install poetry
          poetry install
      - run: poetry run pytest
